<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Class 10 Daily Worksheets</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f4f8; min-height: 100vh; }

  header {
    background: #1a237e;
    color: white;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header span { font-size: 13px; opacity: 0.75; }

  .api-bar {
    background: #fff;
    border-bottom: 1px solid #ddd;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .api-bar label { font-size: 13px; color: #555; font-weight: 500; }
  .api-bar input {
    flex: 1;
    min-width: 220px;
    max-width: 400px;
    padding: 7px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
  }
  .api-bar button {
    padding: 7px 18px;
    background: #1a237e;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .api-bar button:hover { background: #283593; }

  .subject-tabs {
    display: flex;
    gap: 0;
    background: #fff;
    border-bottom: 2px solid #e0e0e0;
    padding: 0 24px;
    overflow-x: auto;
  }
  .subject-tab {
    padding: 12px 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: #666;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .subject-tab:hover { color: #1a237e; }
  .subject-tab.active { color: #1a237e; border-bottom-color: #1a237e; }

  .worksheet-tabs {
    display: flex;
    gap: 8px;
    padding: 14px 24px 0;
  }
  .ws-tab {
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid #bbb;
    background: #fff;
    color: #555;
    transition: all 0.2s;
  }
  .ws-tab:hover { background: #e8eaf6; }
  .ws-tab.active { background: #1a237e; color: #fff; border-color: #1a237e; }

  .content-area { padding: 16px 24px 32px; max-width: 900px; margin: 0 auto; }

  .date-badge {
    font-size: 12px;
    color: #888;
    margin-bottom: 12px;
  }

  .worksheet-header {
    background: #1a237e;
    color: white;
    padding: 14px 20px;
    border-radius: 8px 8px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .worksheet-header h2 { font-size: 16px; font-weight: 600; }
  .worksheet-header span { font-size: 13px; opacity: 0.8; }

  .worksheet-body {
    background: #fff;
    border: 1px solid #ddd;
    border-top: none;
    border-radius: 0 0 8px 8px;
    padding: 20px;
  }

  .loading-box {
    text-align: center;
    padding: 60px 20px;
    color: #888;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #e0e0e0;
    border-top-color: #1a237e;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .question-block {
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid #f0f0f0;
  }
  .question-block:last-of-type { border-bottom: none; }

  .question-text {
    font-size: 14px;
    font-weight: 500;
    color: #222;
    margin-bottom: 10px;
    line-height: 1.5;
  }

  .options { display: flex; flex-direction: column; gap: 7px; }
  .option-label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border: 1px solid #ddd;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
  }
  .option-label:hover { background: #e8eaf6; }
  .option-label input[type=radio] { accent-color: #1a237e; width: 15px; height: 15px; }

  .option-label.correct { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
  .option-label.wrong   { background: #ffebee; border-color: #f44336; color: #c62828; }

  .submit-bar {
    margin-top: 24px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .btn-submit {
    padding: 10px 28px;
    background: #1a237e;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-submit:hover { background: #283593; }
  .btn-submit:disabled { background: #9fa8da; cursor: not-allowed; }

  .btn-refresh {
    padding: 10px 18px;
    background: #fff;
    color: #1a237e;
    border: 1px solid #1a237e;
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-refresh:hover { background: #e8eaf6; }

  .score-box {
    background: #e8f5e9;
    border: 1px solid #a5d6a7;
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .score-circle {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: #1a237e;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .score-circle small { font-size: 10px; font-weight: 400; }
  .score-info h3 { font-size: 15px; font-weight: 600; color: #2e7d32; }
  .score-info p  { font-size: 13px; color: #555; margin-top: 2px; }

  .error-box {
    background: #fff3e0;
    border: 1px solid #ffb74d;
    border-radius: 8px;
    padding: 16px 20px;
    font-size: 14px;
    color: #e65100;
  }

  .answer-key { font-size: 12px; margin-top: 6px; padding: 5px 10px; background: #f9f9f9; border-radius: 5px; color: #444; }
</style>
</head>
<body>

<header>
  <div>
    <h1>📚 Class 10 Daily Worksheets</h1>
    <span>AI-generated questions · Refreshes every day</span>
  </div>
</header>

<div class="api-bar">
  <label for="apiKey">Gemini API Key:</label>
  <input type="password" id="apiKey" placeholder="Paste your Gemini API key here..." />
  <button onclick="saveKey()">Save & Start</button>
  <span id="keyStatus" style="font-size:12px;color:green;"></span>
</div>

<div class="subject-tabs" id="subjectTabs"></div>

<div style="padding: 10px 24px 0;">
  <div class="worksheet-tabs" id="wsTabs"></div>
</div>

<div class="content-area" id="contentArea">
  <div class="loading-box" style="color:#aaa;">
    Enter your Gemini API key above and click <strong>Save &amp; Start</strong> to begin.
  </div>
</div>

<script>
const SUBJECTS = ["Physics", "Maths", "Biology", "Chemistry"];
const WORKSHEETS = ["Worksheet 1", "Worksheet 2", "Worksheet 3"];

let activeSubject = 0;
let activeWS = 0;
let apiKey = "";
let cache = {};  // cache[subject][ws] = { questions, submitted }

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function cacheKey(s, w) {
  return `${todayStr()}_${s}_${w}`;
}

function saveKey() {
  const k = document.getElementById("apiKey").value.trim();
  if (!k) { alert("Please enter your API key."); return; }
  apiKey = k;
  document.getElementById("keyStatus").textContent = "✔ Key saved";
  initTabs();
  loadWorksheet(activeSubject, activeWS);
}

function initTabs() {
  const st = document.getElementById("subjectTabs");
  st.innerHTML = SUBJECTS.map((s, i) =>
    `<div class="subject-tab${i===activeSubject?' active':''}" onclick="switchSubject(${i})">${s}</div>`
  ).join("");

  const wt = document.getElementById("wsTabs");
  wt.innerHTML = WORKSHEETS.map((w, i) =>
    `<div class="ws-tab${i===activeWS?' active':''}" onclick="switchWS(${i})">${w}</div>`
  ).join("");
}

function switchSubject(i) {
  activeSubject = i;
  activeWS = 0;
  initTabs();
  loadWorksheet(activeSubject, activeWS);
}

function switchWS(i) {
  activeWS = i;
  initTabs();
  loadWorksheet(activeSubject, activeWS);
}

function loadWorksheet(si, wi) {
  const key = cacheKey(si, wi);
  if (cache[key]) {
    renderWorksheet(cache[key], si, wi);
    return;
  }
  showLoading(si, wi);
  generateQuestions(si, wi);
}

function showLoading(si, wi) {
  document.getElementById("contentArea").innerHTML = `
    <div class="date-badge">📅 ${todayStr()} &nbsp;·&nbsp; ${SUBJECTS[si]} &nbsp;·&nbsp; ${WORKSHEETS[wi]}</div>
    <div class="worksheet-header">
      <h2>${SUBJECTS[si]} — ${WORKSHEETS[wi]}</h2>
      <span>20 Questions</span>
    </div>
    <div class="worksheet-body">
      <div class="loading-box">
        <div class="spinner"></div>
        <p>Generating questions with Gemini AI...</p>
        <p style="font-size:12px;margin-top:6px;color:#aaa;">This may take 10–20 seconds</p>
      </div>
    </div>`;
}

async function generateQuestions(si, wi) {
  const subject = SUBJECTS[si];
  const wsNum = wi + 1;
  const today = todayStr();

  const prompt = `You are a Class 10 (CBSE/ICSE) ${subject} teacher. Generate exactly 20 multiple choice questions for Worksheet ${wsNum} for the date ${today}.

Rules:
- Each question must be from the Class 10 ${subject} curriculum
- Each question must have exactly 4 options: A, B, C, D
- Indicate the correct answer
- Make questions educational, clear, and of medium difficulty
- Vary topics across the worksheet

Return ONLY a valid JSON array with exactly 20 objects. No explanation, no markdown, no extra text.
Format:
[
  {
    "q": "Question text here?",
    "options": ["Option A text", "Option B text", "Option C text", "Option D text"],
    "answer": 0
  }
]
where "answer" is the 0-based index of the correct option (0=A, 1=B, 2=C, 3=D).`;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.7, maxOutputTokens: 4000 }
        })
      }
    );

    const data = await res.json();

    if (data.error) {
      showError("API Error: " + data.error.message);
      return;
    }

    let raw = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
    raw = raw.replace(/```json/g, "").replace(/```/g, "").trim();

    const questions = JSON.parse(raw);
    if (!Array.isArray(questions) || questions.length < 10) {
      showError("Invalid response from Gemini. Please try again.");
      return;
    }

    const key = cacheKey(si, wi);
    cache[key] = { questions, submitted: false, userAnswers: {} };
    renderWorksheet(cache[key], si, wi);

  } catch (e) {
    showError("Something went wrong: " + e.message + ". Check your API key and try again.");
  }
}

function renderWorksheet(data, si, wi) {
  const { questions, submitted, userAnswers } = data;
  const subject = SUBJECTS[si];
  const ws = WORKSHEETS[wi];

  let qHtml = questions.map((q, qi) => {
    const opts = q.options.map((opt, oi) => {
      let cls = "option-label";
      if (submitted) {
        if (oi === q.answer) cls += " correct";
        else if (userAnswers[qi] === oi && oi !== q.answer) cls += " wrong";
      }
      const checked = userAnswers[qi] === oi ? "checked" : "";
      const disabled = submitted ? "disabled" : "";
      return `<label class="${cls}">
        <input type="radio" name="q${qi}" value="${oi}" ${checked} ${disabled} onchange="selectAnswer(${qi},${oi})">
        <span>${String.fromCharCode(65+oi)}. ${escHtml(opt)}</span>
      </label>`;
    }).join("");

    return `<div class="question-block">
      <p class="question-text">${qi+1}. ${escHtml(q.q)}</p>
      <div class="options">${opts}</div>
    </div>`;
  }).join("");

  let scoreHtml = "";
  if (submitted) {
    const score = questions.reduce((acc, q, qi) => acc + (userAnswers[qi] === q.answer ? 1 : 0), 0);
    const pct = Math.round((score / questions.length) * 100);
    const grade = pct >= 90 ? "Excellent! 🎉" : pct >= 70 ? "Good job! 👍" : pct >= 50 ? "Keep practising 📖" : "Needs more revision 💪";
    scoreHtml = `<div class="score-box">
      <div class="score-circle">${score}<small>/${questions.length}</small></div>
      <div class="score-info">
        <h3>${grade}</h3>
        <p>You scored ${score} out of ${questions.length} &nbsp;(${pct}%)</p>
        <p style="margin-top:4px;font-size:12px;">Correct answers are highlighted in green. Wrong ones in red.</p>
      </div>
    </div>`;
  }

  const submitBtnLabel = submitted ? "Submitted ✔" : "Submit Answers";
  const submitDisabled = submitted ? "disabled" : "";

  document.getElementById("contentArea").innerHTML = `
    <div class="date-badge">📅 ${todayStr()} &nbsp;·&nbsp; ${subject} &nbsp;·&nbsp; ${ws}</div>
    <div class="worksheet-header">
      <h2>${subject} — ${ws}</h2>
      <span>${questions.length} Questions</span>
    </div>
    <div class="worksheet-body">
      ${scoreHtml}
      ${qHtml}
      <div class="submit-bar">
        <button class="btn-refresh" onclick="refreshWorksheet(${si},${wi})">🔄 Regenerate</button>
        <button class="btn-submit" id="submitBtn" onclick="submitWorksheet(${si},${wi})" ${submitDisabled}>${submitBtnLabel}</button>
      </div>
    </div>`;
}

function selectAnswer(qi, oi) {
  const key = cacheKey(activeSubject, activeWS);
  if (cache[key]) cache[key].userAnswers[qi] = oi;
}

function submitWorksheet(si, wi) {
  const key = cacheKey(si, wi);
  if (!cache[key]) return;
  const answered = Object.keys(cache[key].userAnswers).length;
  if (answered < cache[key].questions.length) {
    const unanswered = cache[key].questions.length - answered;
    if (!confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`)) return;
  }
  cache[key].submitted = true;
  renderWorksheet(cache[key], si, wi);
}

function refreshWorksheet(si, wi) {
  if (!confirm("Regenerate this worksheet? Current answers will be lost.")) return;
  const key = cacheKey(si, wi);
  delete cache[key];
  loadWorksheet(si, wi);
}

function showError(msg) {
  document.getElementById("contentArea").innerHTML += `
    <div style="padding:0 0 12px;">
      <div class="error-box">⚠️ ${escHtml(msg)}</div>
    </div>`;
  document.querySelector(".worksheet-body .loading-box")?.remove();
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

initTabs();
</script>
</body>
</html>
